name: Website checks

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npx vite build
        env:
          VITE_API_BASE_URL: https://molek-school-backend-production.up.railway.app
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (public pages, header, interactions, portal)
        run: npm run test:e2e
      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
